# QuickPat Compose CI — generated by `quickpat init-ci`
# Validates spec.yaml, composes VP and QS outputs, and verifies that the
# committed vp-out/ and qs-out/ directories match what compose produces.
#
# Re-run `quickpat init-ci` to upgrade this file when the template changes.

name: Compose and Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compose-and-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install QuickPat
        run: pip install git+https://github.com/atyronesmith/quickpat.git

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      # ── Spec validation ──────────────────────────────────────────────────────
      # Validates spec.yaml semantically before generating anything.
      # --strict treats warnings as errors; remove if you want warnings to pass.

      - name: Validate spec
        run: quickpat validate-spec spec.yaml --strict

      # ── VP compose + validation ──────────────────────────────────────────────

      - name: Compose VP
        run: quickpat compose spec.yaml --output /tmp/vp-out

      - name: Check VP drift
        # Fail if vp-out/ in the repo doesn't match what compose produces.
        # pattern-metadata.yaml is excluded because it contains a generation date.
        run: |
          diff -rq \
            --exclude='pattern-metadata.yaml' \
            /tmp/vp-out/ vp-out/ \
            && echo "vp-out/ is up to date" \
            || {
              echo ""
              echo "ERROR: vp-out/ is stale — spec.yaml was changed but vp-out/ was not regenerated."
              echo "Run the following and commit the result:"
              echo "  quickpat compose spec.yaml"
              exit 1
            }

      - name: Validate VP
        id: validate_vp
        run: |
          quickpat validate /tmp/vp-out --json > /tmp/vp-out/validation-report.json || true
          quickpat validate /tmp/vp-out

      - name: Helm lint (VP charts)
        id: helm_lint_vp
        run: |
          STATUS="SKIP"
          for chart_dir in /tmp/vp-out/charts/*/; do
            [ -f "$chart_dir/Chart.yaml" ] || continue
            echo "Linting: $(basename "$chart_dir")"
            if helm lint "$chart_dir" 2>&1; then
              [ "$STATUS" = "SKIP" ] && STATUS="PASS"
            else
              STATUS="FAIL"
            fi
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Validate VP manifests (kubeconform)
        id: kubeconform_vp
        run: |
          STATUS="SKIP"
          for chart_dir in /tmp/vp-out/charts/*/; do
            [ -f "$chart_dir/Chart.yaml" ] || continue
            RENDERED=$(helm template test "$chart_dir" 2>/dev/null) || continue
            if echo "$RENDERED" | kubeconform -summary -strict -ignore-missing-schemas 2>&1; then
              [ "$STATUS" = "SKIP" ] && STATUS="PASS"
            else
              STATUS="FAIL"
            fi
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload generated VP
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vp-out
          path: /tmp/vp-out
          retention-days: 7

      # ── QS compose + validation ──────────────────────────────────────────────

      - name: Compose QS
        run: quickpat compose spec.yaml --format qs --output /tmp/qs-out

      - name: Check QS drift
        run: |
          diff -rq /tmp/qs-out/ qs-out/ \
            && echo "qs-out/ is up to date" \
            || {
              echo ""
              echo "ERROR: qs-out/ is stale — spec.yaml was changed but qs-out/ was not regenerated."
              echo "Run the following and commit the result:"
              echo "  quickpat compose spec.yaml --format qs"
              exit 1
            }

      - name: Helm lint (QS chart)
        id: helm_lint_qs
        run: |
          STATUS="SKIP"
          if [ -f "qs-out/chart/Chart.yaml" ]; then
            if helm lint qs-out/chart/ 2>&1; then
              STATUS="PASS"
            else
              STATUS="FAIL"
            fi
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Validate QS manifests (kubeconform)
        id: kubeconform_qs
        run: |
          STATUS="SKIP"
          if [ -f "qs-out/chart/Chart.yaml" ]; then
            RENDERED=$(helm template test qs-out/chart/ 2>/dev/null) || true
            if [ -n "$RENDERED" ]; then
              if echo "$RENDERED" | kubeconform -summary -strict -ignore-missing-schemas 2>&1; then
                STATUS="PASS"
              else
                STATUS="FAIL"
              fi
            fi
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload generated QS
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qs-out
          path: /tmp/qs-out
          retention-days: 7

      # ── Additional checks ────────────────────────────────────────────────────

      - name: Check for :latest image tags
        # :latest tags are non-reproducible. This is a warning, not a hard failure.
        run: |
          FOUND=$(grep -r ':latest' /tmp/vp-out/charts/ /tmp/qs-out/chart/templates/ \
            2>/dev/null | grep -v '.helmignore' || true)
          if [ -n "$FOUND" ]; then
            echo "WARNING: Found :latest image tags in generated charts."
            echo "Consider pinning to a specific digest for reproducible builds."
            echo "$FOUND"
          else
            echo "No :latest tags found."
          fi

      - name: Check doc links
        # Checks for broken URLs in docs/ markdown files.
        # Failures are warnings only (|| true) — network flakiness should not block PRs.
        if: hashFiles('docs/**/*.md') != ''
        run: |
          pip install --quiet requests
          python3 - <<'EOF'
          import re, sys, urllib.request, urllib.error
          from pathlib import Path

          URL_RE = re.compile(r'https?://[^\s\)\]>"]+')
          broken = []

          for md_file in sorted(Path('docs').rglob('*.md')):
              text = md_file.read_text(errors='replace')
              for url in URL_RE.findall(text):
                  url = url.rstrip('.,;)')
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'quickpat-ci/1.0'})
                      urllib.request.urlopen(req, timeout=10)
                  except urllib.error.HTTPError as e:
                      if e.code not in (429, 403):   # rate-limit / auth = skip
                          broken.append(f"{md_file}: {url} → HTTP {e.code}")
                  except Exception:
                      pass   # network errors treated as skip, not failure

          if broken:
              print("Broken links found:")
              for b in broken:
                  print(f"  {b}")
          else:
              print("All links OK.")
          EOF

      # ── Summary and PR comment ───────────────────────────────────────────────

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## __PATTERN_NAME__ — compose results"
            echo ""
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| quickpat validate-spec | ${{ steps.validate_spec_step.outcome || 'skipped' }} |"
            echo "| quickpat validate (VP) | ${{ steps.validate_vp.outcome }} |"
            echo "| helm lint (VP)         | ${{ steps.helm_lint_vp.outputs.status }} |"
            echo "| kubeconform (VP)       | ${{ steps.kubeconform_vp.outputs.status }} |"
            echo "| helm lint (QS)         | ${{ steps.helm_lint_qs.outputs.status }} |"
            echo "| kubeconform (QS)       | ${{ steps.kubeconform_qs.outputs.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- __COMMENT_MARKER__ -->"
          BODY="${MARKER}
          ## __PATTERN_NAME__ — compose results

          | Step | Status |
          |---|---|
          | quickpat validate (VP) | ${{ steps.validate_vp.outcome }} |
          | helm lint VP / QS | ${{ steps.helm_lint_vp.outputs.status }} / ${{ steps.helm_lint_qs.outputs.status }} |
          | kubeconform VP / QS | ${{ steps.kubeconform_vp.outputs.status }} / ${{ steps.kubeconform_qs.outputs.status }} |"

          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"

          EXISTING=$(gh pr view "$PR" --repo "$REPO" \
            --json comments \
            --jq ".comments[] | select(.body | contains(\"__COMMENT_MARKER__\")) | .id" \
            2>/dev/null | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${REPO}/issues/comments/${EXISTING}" -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR" --repo "$REPO" --body "$BODY"
          fi
