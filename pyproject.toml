[project]
name = "quickpat"
version = "0.2.0"
description = "Convert AI Quickstarts into Validated Patterns"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
 "jinja2>=3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
deepinfra = ["openai>=1.0"]
vllm = ["openai>=1.0"]
llm = ["openai>=1.0", "anthropic>=0.40"]

[project.scripts]
quickpat = "quickpat.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.3", "pre-commit>=3.0"]

[tool.pytest.ini_options]
markers = [
    "eval: full pipeline evaluation tests (deselect with '-m not eval')",
]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
